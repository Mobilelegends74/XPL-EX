name: Build XPL-EX Settings API Lab

on:
  push:
    branches:
      - XPL-EX-NEXT-v1.6.7-settings-api-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-api-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Unit tests and signed module plus probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD SIGNING_CERT_SHA256; do
            if [[ -z "${!key}" ]]; then echo "Signing secret missing: $key" >&2; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/KEYSTORE.JKS"
          keytool -list -keystore "$GITHUB_WORKSPACE/KEYSTORE.JKS" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build app and isolated probe and execute tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:testReleaseUnitTest :app:assembleRelease :identitylab:assembleRelease

      - name: Verify signatures and APK identities
        run: |
          set -euo pipefail
          module_apk="app/build/outputs/apk/release/XPL-EX-NEXT-1.6.7-system-lab-release.apk"
          probe_apk="identitylab/build/outputs/apk/release/IdentityLab-1.0.0-release.apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          for apk in "$module_apk" "$probe_apk"; do
            test -s "$apk"
            result=$("$bt/apksigner" verify --verbose --print-certs "$apk")
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$result" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
            expected=$(echo "${{ secrets.SIGNING_CERT_SHA256 }}" | tr '[:upper:]' '[:lower:]' | tr -d ':')
            test -n "$actual"
            test "$actual" = "$expected"
            cp "$apk" dist/
          done
          "$bt/aapt" dump badging "$module_apk" | grep -q "versionCode='176'"
          "$bt/aapt" dump badging "$module_apk" | grep -q "package: name='eu.faircode.xlua'"
          "$bt/aapt" dump badging "$probe_apk" | grep -q "package: name='eu.faircode.xlua.identitylab'"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: XPL-EX-NEXT-1.6.7-settings-api-lab-signed
          path: dist/
          retention-days: 30
          if-no-files-found: error
