name: Build and publish XPL-EX-NEXT v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - new-ui-1.5.8

permissions:
  contents: write

concurrency:
  group: xpl-ex-next-v1.2-release
  cancel-in-progress: false

env:
  RELEASE_TAG: XPL-EX-NEXT-v1.2
  RELEASE_TITLE: XPL-EX-NEXT v1.2
  BUILD_APK: XPL-EX-NEXT-1.5.6-release.apk
  RELEASE_APK: XPL-EX-NEXT-1.5.6.apk

jobs:
  build-and-release:
    name: Build, verify and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" \
                && -n "${RELEASE_STORE_PASSWORD}" \
                && -n "${RELEASE_KEY_ALIAS}" \
                && -n "${RELEASE_KEY_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/KEYSTORE.JKS"
            {
              printf 'KEYSTORE_PASSWORD=%s\n' "${RELEASE_STORE_PASSWORD}"
              printf 'KEY_ALIAS=%s\n' "${RELEASE_KEY_ALIAS}"
              printf 'KEY_PASSWORD=%s\n' "${RELEASE_KEY_PASSWORD}"
            } >> "${GITHUB_ENV}"
            echo "Using the configured release signing key."
          else
            keytool -genkeypair \
              -keystore "${GITHUB_WORKSPACE}/KEYSTORE.JKS" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=XPL-EX CI,OU=Mobilelegends74,O=Android,C=US"
            {
              echo 'KEYSTORE_PASSWORD=android'
              echo 'KEY_ALIAS=androiddebugkey'
              echo 'KEY_PASSWORD=android'
            } >> "${GITHUB_ENV}"
            echo "No release key secrets were configured; using a temporary CI signing key."
          fi

      - name: Test and build Xposed-compatible release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            echo "Gradle attempt ${attempt} failed; retrying after a short delay."
            sleep $((attempt * 15))
          done

      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/${BUILD_APK}"
          test -f "${source_apk}"

          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          "${build_tools}/apksigner" verify --verbose --print-certs "${source_apk}"
          badging=$("${build_tools}/aapt" dump badging "${source_apk}")
          grep -q "versionCode='155'" <<< "${badging}"
          grep -q "versionName='1.5.6'" <<< "${badging}"

          mkdir -p dist
          cp "${source_apk}" "dist/${RELEASE_APK}"
          (cd dist && sha256sum "${RELEASE_APK}") | tee "dist/${RELEASE_APK}.sha256"
          apk_sha256=$(cut -d' ' -f1 "dist/${RELEASE_APK}.sha256")
          echo "sha256=${apk_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release description
        run: |
          set -euo pipefail
          cp docs/releases/xpl-ex-next-v1.2.md "${RUNNER_TEMP}/release-notes.md"

      - name: Write build summary
        run: |
          {
            echo "# ${RELEASE_TITLE}"
            echo
            echo "- Tests: passed"
            echo "- Version name: 1.5.6"
            echo "- Version code: 155"
            echo "- R8 minification: disabled for Xposed/Lua hook compatibility"
            echo "- APK: ${RELEASE_APK}"
            echo "- SHA-256: ${{ steps.apk.outputs.sha256 }}"
            echo "- Release tag: ${RELEASE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPL-EX-NEXT-1.5.6
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/${{ env.RELEASE_APK }}
            dist/${{ env.RELEASE_APK }}.sha256
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Remove superseded broken releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for old_tag in v1.5.6-155 v1.5.6-155-new-ui-1.5.8; do
            if gh release view "${old_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete "${old_tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --cleanup-tag \
                --yes
              echo "Removed superseded release and tag: ${old_tag}"
            else
              echo "Superseded release already absent: ${old_tag}"
            fi
          done
