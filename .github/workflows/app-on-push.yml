name: Build and publish XPL-EX-NEXT v1.6.3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xpl-ex-next-v1.6.3-release
  cancel-in-progress: false

env:
  RELEASE_TAG: XPL-EX-NEXT-v1.6.3
  RELEASE_TITLE: XPL-EX-NEXT v1.6.3
  BUILD_APK: XPL-EX-NEXT-1.6.3-release.apk
  RELEASE_APK: XPL-EX-NEXT-1.6.3.apk

jobs:
  build-and-release:
    name: Build, verify and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${sdkmanager_path}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          "${sdkmanager_path}" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD SIGNING_CERT_SHA256; do
            if [[ -z "${!required}" ]]; then
              echo "Required permanent signing secret ${required} is missing." >&2
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/KEYSTORE.JKS"
          keytool -list \
            -keystore "${GITHUB_WORKSPACE}/KEYSTORE.JKS" \
            -storepass "${RELEASE_STORE_PASSWORD}" \
            -alias "${RELEASE_KEY_ALIAS}" > /dev/null
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "${RELEASE_STORE_PASSWORD}"
            printf 'KEY_ALIAS=%s\n' "${RELEASE_KEY_ALIAS}"
            printf 'KEY_PASSWORD=%s\n' "${RELEASE_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"
          echo "Using the permanent XPL-EX release signing key."

      - name: Test and build Xposed-compatible release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            echo "Gradle attempt ${attempt} failed; retrying after a short delay."
            sleep $((attempt * 15))
          done

      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/${BUILD_APK}"
          test -f "${source_apk}"

          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          signer_output=$("${build_tools}/apksigner" verify --verbose --print-certs "${source_apk}")
          printf '%s\n' "${signer_output}"
          signer_sha256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "${signer_output}" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
          expected_sha256=$(tr '[:upper:]' '[:lower:]' <<< "${{ secrets.SIGNING_CERT_SHA256 }}" | tr -d ':')
          test -n "${signer_sha256}"
          test "${signer_sha256}" = "${expected_sha256}"
          badging=$("${build_tools}/aapt" dump badging "${source_apk}")
          grep -q "versionCode='168'" <<< "${badging}"
          grep -q "versionName='1.6.3'" <<< "${badging}"

          mkdir -p dist
          cp "${source_apk}" "dist/${RELEASE_APK}"
          (cd dist && sha256sum "${RELEASE_APK}") | tee "dist/${RELEASE_APK}.sha256"
          apk_sha256=$(cut -d' ' -f1 "dist/${RELEASE_APK}.sha256")
          echo "sha256=${apk_sha256}" >> "${GITHUB_OUTPUT}"
          echo "signer_sha256=${signer_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release description
        run: |
          set -euo pipefail
          cp docs/releases/xpl-ex-next-v1.6.3.md "${RUNNER_TEMP}/release-notes.md"

      - name: Write build summary
        run: |
          {
            echo "# ${RELEASE_TITLE}"
            echo
            echo "- Tests: passed"
            echo "- Version name: 1.6.3"
            echo "- Version code: 168"
            echo "- libxposed API: 101"
            echo "- Bridge protocol: 1.5.5"
            echo "- R8 minification: disabled for Xposed/Lua hook compatibility"
            echo "- APK: ${RELEASE_APK}"
            echo "- SHA-256: ${{ steps.apk.outputs.sha256 }}"
            echo "- Signing certificate SHA-256: ${{ steps.apk.outputs.signer_sha256 }}"
            echo "- Release tag: ${RELEASE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPL-EX-NEXT-1.6.3
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/${{ env.RELEASE_APK }}
            dist/${{ env.RELEASE_APK }}.sha256
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
