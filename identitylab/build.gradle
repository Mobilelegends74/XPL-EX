apply plugin: 'com.android.application'

android {
    namespace 'eu.faircode.xlua.identitylab'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'eu.faircode.xlua.identitylab'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        archivesBaseName = "IdentityLab-$versionName"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (System.getenv('GITHUB_WORKSPACE') != null) {
                storeFile file("${System.getenv('GITHUB_WORKSPACE')}/KEYSTORE.JKS")
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}
